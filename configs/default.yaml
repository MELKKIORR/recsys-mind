# Paths
raw_dir: data/raw
processed_dir: data/processed
db_path: data/recsys.db
artefacts_dir: results/artefacts

# Split: MIND train period -> train + validation (last day), MIND dev -> test
validation_days: 1

# Graph and retrieval (MLE-Core)
graph:
  min_cooccurrence: 1        # keep entity pairs seen together in at least N train articles
retrieval:
  hops: 3                    # 1 to 3
  damping: 0.85              # 0.5 to 0.85
  recency_decay: 0.9         # weight of the i-th most recent click = decay^i
  ignored_weight: 0.5        # 0 gives the ablation without the ignored signal
  category_weight: 0.3
  entity_idf: true           # down-weight hub entities (Associated Press...); false = Week 2 behaviour
  max_ignored_impressions: 20

# Evaluation (PL)
eval:
  k_values: [5, 10]
  recall_k: 20
  seed: 42

# LLM (MLE-Core re-ranking, MLE-Ops client and cache)
llm:
  provider: openai            # mock | anthropic | openai  ("openai" also covers Mistral, Groq, Ollama via base_url)
  model: "openai/gpt-oss-20b"                  # model name of the chosen provider
  base_url: "https://api.groq.com/openai/v1"               # only for provider openai: e.g. https://api.mistral.ai/v1, https://api.groq.com/openai/v1, http://localhost:11434/v1
  temperature: 0
  max_tokens: 2000
  extra_body:
    reasoning_effort: low
  cache_dir: results/llm_cache
  prompt_version: v2
  timeout: 60                # seconds before a call counts as failed (the caller falls back)
  price_input_per_mtok: 0.0  # $ per million input tokens of the chosen model, for the cost measure
  price_output_per_mtok: 0.0 # $ per million output tokens
rerank:
  top_n: 10                  # candidates sent to the LLM (5, 10, 15)
  fusion_weight: 0.5         # fixed rule: 0 = graph only, 1 = LLM only
  fusion: rule               # rule (fixed weight above) | learned (trained layer, python -m src.llm.fusion)
  fusion_weights: results/fusion_weights.json
  min_valid_share: 0.5       # below this share of valid ids, the LLM answer is rejected (fallback)
  max_per_category: 4        # website only: at most 4 articles of one category in the top 10 (0 = off)
